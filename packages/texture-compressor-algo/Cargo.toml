[package]
name = "texcompress"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "texcompress"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []

[dependencies]
libm = "0.2"
wide = "1.2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
rayon = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.92"
console_error_panic_hook = "0.1"
